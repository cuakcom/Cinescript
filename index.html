<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinescript</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Cinescript</h1>
    <div class="toolbar">
      <label>Modo:
        <select id="modeSelect">
          <option value="screenplay">Guión industria</option>
          <option value="novel">Novela estándar</option>
        </select>
      </label>
      <button id="exportTxt">Exportar TXT</button>
      <button id="exportJson">Exportar Proyecto</button>
    </div>
  </header>

  <main>
    <aside class="left-panel">
      <section>
        <h2>Estructura</h2>
        <ul id="structureList"></ul>
        <button id="addScene">+ Escena</button>
      </section>
      <section>
        <h2>Personajes</h2>
        <ul id="charactersList"></ul>
        <button id="addCharacter">+ Personaje</button>
      </section>
      <section>
        <h2>Localizaciones</h2>
        <ul id="locationsList"></ul>
        <button id="addLocation">+ Localización</button>
      </section>
    </aside>

    <section class="editor-panel">
      <div id="editor" contenteditable="true" aria-label="Editor de guion"></div>
    </section>

    <aside class="right-panel">
      <section>
        <h2>Ficha</h2>
        <div id="details">Selecciona un personaje o localización.</div>
      </section>
      <section>
        <h2>Relaciones</h2>
        <div id="relations">Sin relaciones definidas.</div>
      </section>
      <section>
        <h2>Imagen IA</h2>
        <p>Soporte preparado para generador local (Stable Diffusion/ComfyUI) sin APIs de pago.</p>
      </section>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
