[package]
name = "cinescript"
version = "2.0.0"
description = "Professional screenplay writing application for Windows"
authors = ["Cinescript Team"]
edition = "2021"
rust-version = "1.60"
publish = false

[lib]
name = "cinescript_lib"
path = "src/lib.rs"

[[bin]]
name = "cinescript"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.11", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11", features = ["shell-open"] }
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
